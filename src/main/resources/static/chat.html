<script>
    let currentUser = null;
    let selectedUser = null;
    let stompClient = null;
    let activeSubscription = null;
    const renderedMessageIds = new Set();

    document.addEventListener('DOMContentLoaded', async () => {
        if (!localStorage.getItem('accessToken')) {
            window.location.href = '/login.html';
            return;
        }

        // 👇 1. SAHIFA YUKLANGANDA BROWSERDAN BILDIRISHNOMAGA RUXSAT SO'RASH
        if (window.Notification && Notification.permission !== "granted" && Notification.permission !== "denied") {
            Notification.requestPermission();
        }

        await loadCurrentUser();
        await loadUsers();
        connectWebSocket();
    });

    document.getElementById('messageForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        await sendMessage();
    });

    async function loadCurrentUser() {
        const response = await secureFetch('/api/users/me');
        if (!response || !response.ok) {
            window.location.href = '/login.html';
            return;
        }

        currentUser = await response.json();
        document.getElementById('currentUserLabel').innerText = `Siz: ${currentUser.fullName || currentUser.username}`;
    }

    async function loadUsers() {
        const list = document.getElementById('usersList');
        const response = await secureFetch('/api/users/chat');
        if (!response || !response.ok) {
            list.innerHTML = `<div class="p-4 text-sm text-red-500">Userlar yuklanmadi.</div>`;
            return;
        }

        const users = await response.json();
        if (!users.length) {
            list.innerHTML = `<div class="p-4 text-sm text-slate-400">Yozishish uchun boshqa user yo'q.</div>`;
            return;
        }

        list.innerHTML = users.map(user => `
            <button data-user-id="${user.userId}"
                    data-username="${escapeAttr(user.username)}"
                    data-full-name="${escapeAttr(user.fullName || '')}"
                    id="user-${user.userId}"
                    class="w-full p-4 text-left hover:bg-blue-50 transition-colors flex items-center justify-between">
                <div>
                    <div class="font-semibold text-slate-800">${escapeHtml(user.fullName || user.username)}</div>
                    <div class="text-xs text-slate-400">@${escapeHtml(user.username)}</div>
                </div>
                <div id="badge-${user.userId}" class="w-2.5 h-2.5 bg-emerald-500 rounded-full hidden"></div>
            </button>
        `).join('');

        list.querySelectorAll('button[data-user-id]').forEach(button => {
            button.addEventListener('click', () => {
                selectUser(Number(button.dataset.userId), button.dataset.username, button.dataset.fullName);
            });
        });
    }

    async function selectUser(userId, username, fullName) {
        selectedUser = { userId, username, fullName };

        document.querySelectorAll('[id^="user-"]').forEach(el => el.classList.remove('bg-blue-50'));
        document.getElementById(`user-${userId}`)?.classList.add('bg-blue-50');

        // Chat ochilganda o'sha user yonidagi yashil nuqtani o'chiramiz
        document.getElementById(`badge-${userId}`)?.classList.add('hidden');

        document.getElementById('chatTitle').innerText = fullName || username;
        document.getElementById('chatSubtitle').innerText = `@${username}`;
        document.getElementById('messageInput').disabled = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('refreshBtn').disabled = false;

        subscribeToConversation();
        await loadConversation();
    }

    async function loadConversation() {
        if (!selectedUser) return;

        const messagesEl = document.getElementById('messages');
        messagesEl.innerHTML = `<div class="py-12 text-center text-slate-400">Xabarlar yuklanmoqda...</div>`;
        renderedMessageIds.clear();

        const response = await secureFetch(`/api/chat/conversation/${selectedUser.userId}`);
        if (!response || !response.ok) {
            messagesEl.innerHTML = `<div class="py-12 text-center text-red-500">Xabarlar yuklanmadi.</div>`;
            return;
        }

        const messages = await response.json();
        messagesEl.innerHTML = '';

        if (!messages.length) {
            messagesEl.innerHTML = `<div class="py-12 text-center text-slate-400">Hali xabar yo'q. Birinchi xabarni yuboring.</div>`;
            return;
        }

        messages.forEach(renderMessage);
        scrollToBottom();
    }

    function connectWebSocket() {
        const status = document.getElementById('connectionStatus');
        const socket = new SockJS('/ws-ecommerce');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({ Authorization: `Bearer ${localStorage.getItem('accessToken')}` }, () => {
            status.className = 'px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold border border-emerald-100';
            status.innerText = 'WS ulandi';

            // 🔥 GLOBAL TINGLOVCHI: O'zimizga tegishli hamma xabarlarni bitta kanaldan eshitamiz
            // Real loyihada foydalanuvchi hamma kelayotgan xabarlardan xabardor bo'lishi kerak
            subscribeToUserChannel();
        }, () => {
            status.className = 'px-3 py-1.5 rounded-full bg-red-50 text-red-700 text-xs font-bold border border-red-100';
            status.innerText = 'WS xatolik';
        });
    }

    // Yangi mantiq: Foydalanuvchi sahifaning o'zida har qanday odamdan xabar kelishini eshitib turadi
    function subscribeToUserChannel() {
        if (!stompClient || !stompClient.connected || !currentUser) return;

        // Har doim o'zimizga tegishli umumiy mavzuni tinglaymiz
        // Masalan: /topic/user/1/chat
        stompClient.subscribe(`/topic/chat/user/${currentUser.userId}`, message => {
            const payload = JSON.parse(message.body);
            handleIncomingMessage(payload);
        });

        // Agar hozir biror user tanlangan bo'lsa, dialog kanalini ham tekshiramiz
        subscribeToConversation();
    }

    function subscribeToConversation() {
        if (!stompClient || !stompClient.connected || !currentUser || !selectedUser) return;

        if (activeSubscription) {
            activeSubscription.unsubscribe();
        }

        const topic = conversationTopic(currentUser.userId, selectedUser.userId);
        activeSubscription = stompClient.subscribe(topic, message => {
            const payload = JSON.parse(message.body);
            handleIncomingMessage(payload);
        });
    }

    // 👇 XABAR KELGANDA UNING QAYERDA KO'RINISHINI BOSHQARUVCHI AMALIY FUNKSIYA
    function handleIncomingMessage(payload) {
        // O'zimiz yuborgan xabar bo'lsa srazu ekranga chizamiz
        const isOwn = currentUser && payload.senderId === currentUser.userId;

        if (selectedUser && (payload.senderId === selectedUser.userId || payload.recipientId === selectedUser.userId)) {
            const emptyText = document.querySelector('#messages .text-slate-400');
            if (emptyText) document.getElementById('messages').innerHTML = '';

            renderMessage(payload);
            scrollToBottom();

            // Agar xabar suhbatdoshdan kelgan bo'lsa-yu, lekin biz boshqa tabda bo'lsak (orqa fonda) -> NOTIFICATION
            if (!isOwn && document.hidden) {
                showWebNotification(payload.senderUsername || "Suhbatdosh", payload.content);
            }
        } else if (!isOwn) {
            // Agar xabar mutloqo boshqa, hozir ochiq bo'lmagan userdan kelgan bo'lsa:
            // 1. O'sha user yoniga yashil nuqta (badge) qo'yamiz
            document.getElementById(`badge-${payload.senderId}`)?.classList.remove('hidden');
            // 2. Tizimda bildirishnoma chiqaramiz
            showWebNotification(payload.senderUsername || "Yangi suhbatdosh", payload.content);
        }
    }

    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();
        if (!selectedUser || !content) return;

        const payload = { recipientId: selectedUser.userId, content };
        input.value = '';

        if (stompClient && stompClient.connected) {
            stompClient.send('/app/chat.send', { Authorization: `Bearer ${localStorage.getItem('accessToken')}` }, JSON.stringify(payload));
            return;
        }

        const response = await secureFetch('/api/chat/messages', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        if (response && response.ok) {
            handleIncomingMessage(await response.json());
        }
    }

    function renderMessage(message) {
        if (renderedMessageIds.has(message.id)) return;
        renderedMessageIds.add(message.id);

        const own = currentUser && message.senderId === currentUser.userId;
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${own ? 'justify-end' : 'justify-start'}`;
        wrapper.innerHTML = `
            <div class="max-w-[75%] rounded-2xl px-4 py-3 ${own ? 'bg-blue-600 text-white' : 'bg-white border border-slate-100 text-slate-800'}">
                <div class="text-xs ${own ? 'text-blue-100' : 'text-slate-400'} mb-1">${escapeHtml(message.senderUsername || '')}</div>
                <div class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(message.content)}</div>
                <div class="text-[10px] mt-2 ${own ? 'text-blue-100' : 'text-slate-400'}">${formatDate(message.timestamp)}</div>
            </div>
        `;
        document.getElementById('messages').appendChild(wrapper);
    }

    // 👇 2. BRAUZERDA BILDIRISHNOMA CHIQARUVCHI ASOSIY FUNKSIYA
    function showWebNotification(senderName, messageText) {
        if (window.Notification && Notification.permission === "granted") {
            const notification = new Notification("💬 Yangi xabar: " + senderName, {
                body: messageText,
                // ixtiyoriy ikonka logotipi:
                // icon: "/favicon.ico"
            });

            // Bildirishnoma bosilganda avtomatik sayt oynasiga (tabiga) olib o'tadi
            notification.onclick = function() {
                window.focus();
            };
        }
    }

    function conversationTopic(userId1, userId2) {
        const first = Math.min(userId1, userId2);
        const second = Math.max(userId1, userId2);
        return `/topic/chat/${first}-${second}`;
    }

    // ... Qolgan formatlash funksiyalari (scrollToBottom, formatDate, escapeHtml, escapeAttr) o'zgarishsiz qoladi
</script>
