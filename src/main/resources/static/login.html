<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tizimga Kirish</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen font-sans">

<div class="w-full max-w-md p-8 space-y-6 bg-white rounded-2xl shadow-xl border border-slate-100 transition-all duration-300 hover:shadow-2xl">

    <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-4 shadow-sm">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h2 class="text-3xl font-extrabold text-slate-800 tracking-tight">Xush kelibsiz!</h2>
        <p class="mt-2 text-sm text-slate-500">Davom etish uchun profilingizga kiring</p>
    </div>

    <!-- Xatolik xabari -->
    <div id="errorMessage" class="hidden p-4 text-sm text-red-700 bg-red-50 rounded-xl border border-red-100 flex items-center gap-2">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="errorText">Login yoki parol xato!</span>
    </div>

    <form id="loginForm" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-slate-700 mb-2">Foydalanuvchi nomi</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                <input type="text" id="username" required
                       class="w-full pl-10 pr-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800 text-sm"
                       placeholder="Masalan: admin123">
            </div>
        </div>

        <div>
            <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-semibold text-slate-700">Parol</label>
                <a href="#" class="text-xs font-medium text-blue-600 hover:underline">Parolni unutdingizmi?</a>
            </div>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                <input type="password" id="password" required
                       class="w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-100 transition-all text-slate-800 text-sm"
                       placeholder="********">
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600">
                    <i id="passwordIcon" class="fa-solid fa-eye text-sm"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-md shadow-blue-200 hover:shadow-lg transition-all duration-200 flex items-center justify-center gap-2">
            <span>Kirish</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passwordIcon.className = 'fa-solid fa-eye-slash text-sm';
        } else {
            passwordInput.type = 'password';
            passwordIcon.className = 'fa-solid fa-eye text-sm';
        }
    }

    // --- /api/auth/login so'rovi ---
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const usernameInput = document.getElementById('username').value;
        const passwordInput = document.getElementById('password').value;
        const submitBtn = document.getElementById('submitBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Kirilmoqda...`;
        errorMessage.classList.add('hidden');

        const loginRequest = {
            username: usernameInput,
            password: passwordInput
        };

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(loginRequest)
            });

            const data = await response.json(); // LoginResponse

            if (response.ok) {
                // LoginResponse ichidan keladigan accessToken va refreshToken ni saqlaymiz
                // (O'zgaruvchi nomlarini o'zingizning LoginResponse fieldlariga moslang)
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);

                // Tizim ichkarisiga yo'naltirish
                window.location.href = '/order.html';
            } else {
                errorText.innerText = data.message || 'Login yoki parol xato!';
                errorMessage.classList.remove('hidden');
            }
        } catch (error) {
            errorText.innerText = 'Server bilan aloqa uzildi.';
            errorMessage.classList.remove('hidden');
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Kirish</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
    });
</script>
<div class="fixed bottom-6 left-0 right-0 text-center text-sm text-slate-500">
    Akkauntingiz yo'qmi? <a href="/register.html" class="text-blue-600 font-semibold hover:underline">Ro'yxatdan o'ting</a>
</div>
</body>
</html>
