<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ro'yxatdan o'tish - E-Commerce</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 antialiased font-sans">

<div class="w-full max-w-md bg-white rounded-2xl border border-slate-100 shadow-xl p-6 sm:p-8 transition-all duration-300 hover:shadow-2xl">

    <div class="text-center mb-6 sm:mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-xl bg-blue-50 text-blue-600 mb-3 shadow-sm border border-blue-100">
            <i class="fa-solid fa-user-plus text-xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Yangi hisob yaratish</h1>
        <p class="text-slate-500 text-xs sm:text-sm mt-1">Saytdan mustaqil ro'yxatdan o'tish formasi</p>
    </div>

    <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-xs sm:text-sm font-medium border flex items-center gap-2 animate-pulse"></div>

    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">

        <div>
            <label class="block text-[11px] sm:text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Foydalanuvchi nomi (Username)</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-user text-xs sm:text-sm"></i>
                </span>
                <input type="text" id="username" required autocomplete="username"
                       class="w-full pl-10 pr-4 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="Masalan: jasurbek_dev">
            </div>
        </div>

        <div>
            <label class="block text-[11px] sm:text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">To'liq ism</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-id-card text-xs sm:text-sm"></i>
                </span>
                <input type="text" id="fullName" required autocomplete="name"
                       class="w-full pl-10 pr-4 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="Ism Familiya">
            </div>
        </div>

        <div>
            <label class="block text-[11px] sm:text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Parol</label>
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                    <i class="fa-solid fa-lock text-xs sm:text-sm"></i>
                </span>
                <input type="password" id="password" required autocomplete="new-password"
                       class="w-full pl-10 pr-12 py-2.5 sm:py-3 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="********">
                <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-600 cursor-pointer">
                    <i id="passwordIcon" class="fa-solid fa-eye text-xs sm:text-sm"></i>
                </button>
            </div>
        </div>

        <button type="submit" id="submitBtn"
                class="w-full py-2.5 sm:py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md shadow-blue-500/10 hover:shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-xs sm:text-sm mt-2 cursor-pointer">
            <span>Ro'yxatdan o'tish</span>
            <i class="fa-solid fa-arrow-right text-[10px] sm:text-xs"></i>
        </button>
    </form>

    <div class="text-center mt-6 pt-4 border-t border-slate-100 text-xs sm:text-sm text-slate-500">
        Akkountingiz bormi? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Tizimga kiring</a>
    </div>

</div>

<script>
    // Parolni ko'rsatish yoki yashirish
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const passwordIcon = document.getElementById('passwordIcon');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passwordIcon.className = 'fa-solid fa-eye-slash text-xs sm:text-sm';
        } else {
            passwordInput.type = 'password';
            passwordIcon.className = 'fa-solid fa-eye text-xs sm:text-sm';
        }
    }

    // Registratsiya va Avtomatik Login jarayoni
    async function handleRegister(event) {
        event.preventDefault();

        const username = document.getElementById('username').value.trim();
        const fullName = document.getElementById('fullName').value.trim();
        const password = document.getElementById('password').value;

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        // Tugmani loading holatiga o'tkazish
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-xs sm:text-sm"></i> <span class="text-xs sm:text-sm">Yuborilmoqda...</span>`;
        alertBox.classList.add('hidden');

        try {
            // 1. Spring Security ochiq qoldirgan ro'yxatdan o'tish API'siga yuborish
            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, username, password })
            });

            let responseData = {};
            const contentType = response.headers.get("content-type");
            if (contentType && contentType.includes("application/json")) {
                responseData = await response.json();
            }

            if (response.ok) {
                // 2. Ro'yxatdan muvaffaqiyatli o'tgach, darhol avtomatik login qildirish
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!loginResponse.ok) {
                    throw new Error("Ro'yxatdan o'tdingiz, lekin avtomatik tizimga kirishda xatolik bo'ldi. Login sahifasidan kiring.");
                }

                const data = await loginResponse.json();

                // Token va login ma'lumotlarini saqlash (JWT Rotation uchun)
                if (data.accessToken) localStorage.setItem('accessToken', data.accessToken);
                if (data.refreshToken) localStorage.setItem('refreshToken', data.refreshToken);
                if (data.userId) localStorage.setItem('userId', data.userId);
                if (data.username) localStorage.setItem('username', data.username);
                if (data.role) localStorage.setItem('role', data.role);

                // Asosiy buyurtmalar oynasiga yo'naltirish
                window.location.href = '/order.html';

            } else {
                throw new Error(responseData.message || "Ushbu foydalanuvchi nomi band bo'lishi mumkin.");
            }

        } catch (error) {
            // Xatolikni vizual ko'rsatish
            alertBox.className = "mb-4 p-3.5 rounded-xl text-xs sm:text-sm font-medium border bg-red-50 text-red-700 border-red-100 flex items-center gap-2 animate-pulse";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation shrink-0 text-red-500"></i> <span>${error.message}</span>`;
            alertBox.classList.remove('hidden');

            // Tugmani dastlabki holatiga qaytarish
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Ro'yxatdan o'tish</span> <i class="fa-solid fa-arrow-right text-[10px] sm:text-xs"></i>`;
        }
    }
</script>
</body>
</html>
