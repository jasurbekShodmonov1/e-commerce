<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ro'yxatdan o'tish - E-Commerce</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome Ikonkalar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased font-sans">

<div class="w-full max-w-md bg-white rounded-2xl border border-slate-100 shadow-xl p-8">

    <!-- Logotip va Sarlavha -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-50 text-blue-600 mb-3 shadow-sm border border-blue-100">
            <i class="fa-solid fa-user-plus text-xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Yangi hisob yaratish</h1>
        <p class="text-slate-500 text-sm mt-1">Saytdan mustaqil ro'yxatdan o'tish formasi</p>
    </div>

    <!-- Xatolik yoki Muvaffaqiyat xabari -->
    <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl text-sm font-medium border"></div>

    <!-- Registratsiya Formasi -->
    <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4">

        <!-- Username -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Foydalanuvchi nomi (Username)</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-user text-sm"></i>
                    </span>
                <input type="text" id="username" required autocomplete="off"
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="username_kiriting">
            </div>
        </div>

        <!-- Full name -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">To'liq ism</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-id-card text-sm"></i>
                    </span>
                <input type="text" id="fullName" required autocomplete="off"
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="Ism Familiya">
            </div>
        </div>

        <!-- Parol -->
        <div>
            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Parol</label>
            <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock text-sm"></i>
                    </span>
                <input type="password" id="password" required
                       class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:bg-white transition-all text-slate-800"
                       placeholder="********">
            </div>
        </div>

        <!-- Tugma -->
        <button type="submit" id="submitBtn"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-md shadow-blue-500/10 hover:shadow-blue-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-sm mt-2 cursor-pointer">
            <span>Ro'yxatdan o'tish</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
    </form>

    <!-- Login sahifasiga o'tish -->
    <div class="text-center mt-6 pt-5 border-t border-slate-100 text-sm text-slate-500">
        Akkountingiz bormi? <a href="/login.html" class="text-blue-600 font-semibold hover:underline">Tizimga kiring</a>
    </div>

</div>

<script>
    async function handleRegister(event) {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const fullName = document.getElementById('fullName').value;
        const password = document.getElementById('password').value;

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        // Tugmani vaqtinchalik muzlatish
        submitBtn.disabled = true;
        submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-sm"></i> Yuborilmoqda...`;

        try {
            // Sening Security konfiguratsiyangdagi ochiq "/api/users/register" API'siga yuboramiz
            const response = await fetch('/api/users/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ fullName, username, password })
            });

            if (response.ok) {
                const loginResponse = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                if (!loginResponse.ok) {
                    throw new Error("Ro'yxatdan o'tdingiz, lekin avtomatik kirishda xatolik bo'ldi.");
                }

                const data = await loginResponse.json();
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('username', data.username);
                localStorage.setItem('role', data.role);

                window.location.href = '/order.html';

            } else {
                const errorData = await response.json().catch(() => ({ message: "Xatolik yuz berdi" }));
                throw new Error(errorData.message || "Ushbu ma'lumotlar bilan ro'yxatdan o'tib bo'lmadi.");
            }

        } catch (error) {
            alertBox.className = "mb-4 p-3.5 rounded-xl text-sm font-medium border bg-red-50 text-red-700 border-red-100";
            alertBox.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1.5"></i> ${error.message}`;
            alertBox.classList.remove('hidden');

            // Tugmani qayta tiklash
            submitBtn.disabled = false;
            submitBtn.innerHTML = `<span>Ro'yxatdan o'tish</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
        }
    }
</script>
</body>
</html>
