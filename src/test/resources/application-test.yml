spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # H2 PostgreSQL rejimida ishlashi uchun dialektni aniq ko'rsatamiz
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

  # 1. FLYWAY-NI TESTDA O'CHIRAMIZ (Chunki ddl-auto: create-drop hamma jadvalni o'zi yaratadi)
  flyway:
    enabled: false

  # 2. MINIO VA REDIS-NI TEST UCHUN SOXTA (MOCK) QILAMIZ
  # Agar bular yozilmasa, Spring @Value-larni topolmay kontekstni yiqitadi
  minio:
    url: http://localhost:9000
    access-key: test-key
    secret-key: test-secret
    bucket-name: test-bucket

  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace